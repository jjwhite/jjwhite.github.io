<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link rel="webmention" href="https://webmention.io/jonwhite.me/webmention">
    <link rel="pingback" href="https://webmention.io/jonwhite.me/xmlrpc">
    <link rel="stylesheet" href="/css/clean.css">
    <link rel="alternate" type="application/rss+xml" href="/feed.xml" title="RSS Feed">
    <link rel="alternate" type="application/rss+xml" href="/notes-feed.xml" title="Notes Feed">
    <script defer src="https://cloud.umami.is/script.js" data-website-id="bf94dfe7-4588-4670-9be8-95866d7c0879"></script>
</head>

<body>
    <header>
        <h1><a href="https://jonwhite.me">Jon White's Blog</a></h1>
        <a href="/pages/about.html">About</a><span class="divider">|</span><a href="/posts/">Articles</a><span class="divider">|</span><a href="/notes/">Notes</a><span class="divider">|</span><a href="/pages/blogroll.html">Blogroll</a><span class="divider">|</span><a href="/feed.xml">RSS</a>
    </header>
    <br/>
    <div class="container">
        <article class="note-single">
            <p class="post-date">{{date}}</p>
            <div class="note-content">
                {{page_content}}
            </div>
            {{syndication_html}}
            <p class="note-back-nav"><a href="/notes/" class="back-link">&larr; Back to all notes</a></p>
        </article>
    </div>
    <br/>
    <div class="container">
      <footer>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
                <span class="theme-icon">🌙</span>
            </button>
            <a href="/pages/about.html">About</a><span class="divider">|</span><a href="/posts/">Articles</a><span class="divider">|</span><a href="/notes/">Notes</a><span class="divider">|</span><a href="/pages/blogroll.html">Blogroll</a><span class="divider">|</span><a href="/feed.xml">RSS</a><span class="divider">|</span><a href="https://jjwhite01.bsky.social" rel="me atproto" target="_blank">Bluesky</a><span class="divider">|</span><a href="https://mastodon.world/@jonwhite" rel="me" target="_blank">Mastodon</a>
            <div class="copyright">&copy; {{year}} Jon White</div>
        </footer>
    </div>
    <script src="/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            init();
        });
    </script>
</body>

</html>
