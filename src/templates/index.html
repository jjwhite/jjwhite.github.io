<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JonWhite's blog</title>
    <link rel="stylesheet" href="css/clean.css">
    <link rel="alternate" type="application/rss+xml" href="/feed.xml" title="RSS Feed">
</head>

<body>
    <header>
        <h1><a href="https://jonwhite.me">Jon White's Blog</a></h1>
        <a href="/pages/about.html">About</a><span class="divider">|</span><a href="/posts/">Articles</a><span class="divider">|</span><a href="/pages/blogroll.html">Blogroll</a><span class="divider">|</span><a href="/feed.xml">RSS</a>
    </header>
    <br/>
    <div class="container">
        <h2>Latest Articles</h2>
        {{post_list}}
    </div>
    <br/>
    <div class="container">
       <footer>
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
                <span class="theme-icon">🌙</span>
            </button>
            <a href="/pages/about.html">About</a><span class="divider">|</span><a href="/posts/">Articles</a><span class="divider">|</span><a href="/pages/blogroll.html">Blogroll</a><span class="divider">|</span><a href="/feed.xml">RSS</a>
            <div class="copyright">&copy; {{year}} Jon White</div>
        </footer>
    </div>
    <script src="/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            init();
        });
    </script>
</body>

</html>
