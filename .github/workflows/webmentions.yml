name: Send webmentions

on:
  push:
    branches: [ master ]
    paths:
      - 'src/posts/**'
      - 'src/notes/**'
      - 'code/webmention-manifest.json'
  workflow_dispatch:
    inputs:
      force:
        description: "Resend even if already sent"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: webmentions
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Wait for the CDN to serve the new pages
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "Waiting 60s for GitHub Pages deployment..."
          sleep 60

      - name: Send webmentions
        working-directory: code
        run: python send_webmentions.py ${{ inputs.force && '--force' || '' }}

      - name: Save sent-state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code/webmentions-sent.json
          git diff --cached --quiet || (git commit -m "Update webmention state [skip ci]" && git pull --rebase && git push)
